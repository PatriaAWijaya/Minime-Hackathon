name: Build installers

# Build installer macOS (.dmg) dan Windows (.exe NSIS) untuk app MiniMe.
# Dipicu tiap push ke main yang menyentuh app/ (atau manual via Actions tab).
# Hasil build diunggah sebagai artifact; binary TIDAK masuk git.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-installers.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workdir: app/src-tauri

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      - name: Build frontend
        run: npm run build
        working-directory: app

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minime-installer-${{ matrix.platform }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
