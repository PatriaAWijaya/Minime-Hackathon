name: Build installers

# Build installer macOS (.dmg) dan Windows (.exe NSIS) untuk app MiniMe.
# Dipicu tiap push ke main yang menyentuh app/ (atau manual via Actions tab).
# Hasil build diunggah sebagai artifact; binary TIDAK masuk git.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-installers.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workdir: app/src-tauri

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      - name: Build frontend
        run: npm run build
        working-directory: app

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app

      # Tauri tidak menyediakan opsi menambah file ke DMG, jadi sisipkan
      # script fix Gatekeeper (scripts/Perbaiki MiniMe.command) dengan hdiutil:
      # convert UDZO -> UDRW, attach, salin script + chmod +x, detach,
      # convert kembali ke UDZO dengan nama file DMG yang sama.
      # Hanya job macOS; job Windows tidak diubah.
      - name: Add Gatekeeper fix script to DMG (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail
          DMG=$(ls app/src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)
          echo "DMG: $DMG"
          RW_DMG="${DMG%.dmg}-rw.dmg"
          hdiutil convert "$DMG" -format UDRW -o "$RW_DMG"
          mkdir -p /tmp/minime-dmg
          hdiutil attach "$RW_DMG" -mountpoint /tmp/minime-dmg -nobrowse
          cp "scripts/Perbaiki MiniMe.command" /tmp/minime-dmg/
          chmod +x "/tmp/minime-dmg/Perbaiki MiniMe.command"
          ls -l /tmp/minime-dmg
          hdiutil detach /tmp/minime-dmg || { sleep 5; hdiutil detach /tmp/minime-dmg; }
          NEW_DMG="${DMG%.dmg}-new.dmg"
          hdiutil convert "$RW_DMG" -format UDZO -o "$NEW_DMG"
          mv -f "$NEW_DMG" "$DMG"
          rm -f "$RW_DMG"
          ls -l "$DMG"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minime-installer-${{ matrix.platform }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
