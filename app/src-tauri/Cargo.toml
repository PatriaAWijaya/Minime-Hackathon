[package]
name = "minime"
version = "0.1.0"
description = "MiniMe — Meta Global AI Developer Hackathon 2026 (Indie track) agent orchestrator demo shell"
authors = ["Patria A. Wijaya"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
